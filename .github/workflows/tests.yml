name: snow-chibi

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  capyscheme:
    runs-on: ubuntu-26.04
    steps:
      - name: Install capyscheme
        shell: bash
        run: |
          VERSION=3.1.0
          wget https://github.com/playX18/capyscheme/releases/download/v${VERSION}/capyscheme-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          tar -xf capyscheme-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          cp -r capy/${VERSION} /opt/capy
          ln -sf /opt/capy/capy /usr/local/bin/capy
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: capyscheme
        uses: ./.github/actions/r4rstest-r7rs-small
  chibi:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: chibi
        uses: ./.github/actions/r4rstest-r7rs-small
  cyclone:
    runs-on: ubuntu-24.04
    steps:
      - name: Install cyclone
        shell: bash
        run: |
          sudo apt-get install -y libtommath-dev libck-dev
          wget -O cyclone-bootstrap.tar.gz https://github.com/justinethier/cyclone-bootstrap/archive/refs/tags/v0.36.0.tar.gz
          mkdir cyclone && tar -C cyclone --strip-components 1 -xf cyclone-bootstrap.tar.gz
          cd cyclone
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: cyclone
        uses: ./.github/actions/r4rstest-r7rs-small
  kawa:
    runs-on: ubuntu-26.04
    steps:
      - name: Install kawa
        shell: bash
        run: |
          git clone https://gitlab.com/kashell/Kawa.git
          cd Kawa
          bash autogen.sh
          ./configure --prefix=/usr/local
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: kawa
        uses: ./.github/actions/r4rstest-r7rs-small
  loko:
    runs-on: ubuntu-26.04
    steps:
      - name: Install loko
        shell: bash
        run: |
          wget https://scheme.fail/releases/loko-0.13.0.tar.gz
          tar -xf loko-0.13.0.tar.gz
          cd loko-0.13.0
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: loko
        uses: ./.github/actions/r4rstest-r7rs-small
  meevax:
    runs-on: ubuntu-26.04
    steps:
      - name: Install meevax
        shell: bash
        run: |
          git clone https://github.com/yamacir-kit/meevax.git --branch=release-candidate #--branch=v0.5.596
          cd meevax
          CC=gcc cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cd build
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: meevax
        uses: ./.github/actions/r4rstest-r7rs-small
  mit-scheme-from-apt:
    runs-on: ubuntu-26.04
    steps:
      - name: Install mit-scheme
        shell: bash
        run: sudo apt-get install -y mit-scheme
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: mit-scheme
        uses: ./.github/actions/r4rstest-r7rs-small
  mosh:
    runs-on: ubuntu-26.04
    steps:
      - name: Install mosh
        shell: bash
        run: |
          sudo apt-get install -y libonig-dev
          wget https://github.com/higepon/mosh/releases/download/mosh-0.2.9-rc1/mosh-0.2.9-rc1.tar.gz
          tar -xf mosh-0.2.9-rc1.tar.gz
          cd mosh-0.2.9-rc1
          ./configure --prefix=/usr/local
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: mosh
        uses: ./.github/actions/r4rstest-r7rs-small
  racket-from-apt:
    runs-on: ubuntu-26.04
    steps:
      - name: Install racket
        shell: bash
        run: |
          sudo apt-get install -y racket
          raco pkg install --auto r7rs
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: racket
        uses: ./.github/actions/r4rstest-r7rs-small
  sagittarius:
    runs-on: ubuntu-24.04
    steps:
      - name: Install sagittarius
        shell: bash
        run: |
          sudo apt-get install -y libffi-dev libgc-dev libssl-dev libz-dev
          VERSION=0.9.15
          wget https://github.com/ktakashi/sagittarius-scheme/releases/download/v${VERSION}/sagittarius-${VERSION}.tar.gz
          tar -xf sagittarius-${VERSION}.tar.gz
          cd sagittarius-${VERSION}
          cmake .
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: sagittarius
        uses: ./.github/actions/r4rstest-r7rs-small
  skint:
    runs-on: ubuntu-24.04
    steps:
      - name: Install skint
        shell: bash
        run: |
          git clone https://github.com/false-schemers/skint.git --branch=v0.8.5
          cd skint
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: skint
        uses: ./.github/actions/r4rstest-r7rs-small
  stak:
    runs-on: ubuntu-24.04
    steps:
      - name: Install stak
        shell: bash
        run: |
          VERSION=0.12.33
          wget https://github.com/raviqqe/stak/releases/download/v${VERSION}/stak_${VERSION}_linux_amd64.tar.gz
          tar -xf stak_${VERSION}_linux_amd64.tar.gz
          cp stak /usr/local/bin/stak
          cp stak-compile /usr/local/bin/stak-compile
          cp stak-interpret /usr/local/bin/stak-interpret
          cp stak-repl /usr/local/bin/stak-repl
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: stak
        uses: ./.github/actions/r4rstest-r7rs-small
  stklos:
    runs-on: ubuntu-26.04
    steps:
      - name: Install stklos
        shell: bash
        run: |
          git clone https://github.com/egallesio/STklos.git --branch=version-26.0
          cd STklos
          ./configure --prefix=/usr/local
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: stklos
        uses: ./.github/actions/r4rstest-r7rs-small
  ypsilon:
    runs-on: ubuntu-26.04
    steps:
      - name: Install ypsilon
        shell: bash
        run: |
          sudo apt-get install -y llvm-19 llvm-19-dev clang-19 llvm-19-dev lld-19 libffi-dev libgmp-dev cmake
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-19 50
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 50
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 50
          git clone https://github.com/fujita-y/ypsilon.git
          cd ypsilon
          CC=clang CXX=clang++ cmake -DCMAKE_BUILD_TYPE=Release .
          CC=clang CXX=clang++ cmake --build .
          sudo CC=clang CXX=clang++ cmake --install .
      - uses: actions/checkout@v6
      - name: test
        env:
          SCHEME: ypsilon
        uses: ./.github/actions/r4rstest-r7rs-small
